<title>LocCompare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:ital,wght@0,500;1,500&display=swap">
<style>
/* Mise en page : une colonne d'outils (ajout → fiche → paramètres → comparatif), fiche en deux colonnes sur grand écran. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #eef2f0;
  --line: #d7dfdb;
  --fg: #14201b;
  --muted: #5b6a63;
  --accent: #0f6e5a;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe8;
  --est: #9a5b00;
  --est-soft: #fff1d6;
  --danger: #b4232f;
  --danger-soft: #fde8ea;
  --warn: #8a5a00;
  --warn-soft: #fff4dc;
  --heat-l: 91%;
  --heat-s: 70%;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1d2824; --line: #2c3a35; --fg: #e5ede9; --muted: #98a8a1;
    --accent: #4cc3a3; --accent-fg: #06231b; --accent-soft: #173a31; --est: #f0b45a; --est-soft: #3a2b12;
    --danger: #ff8a93; --danger-soft: #3b1a1e; --warn: #f2c26b; --warn-soft: #362a12; --heat-l: 19%; --heat-s: 30%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1d2824; --line: #2c3a35; --fg: #e5ede9; --muted: #98a8a1;
  --accent: #4cc3a3; --accent-fg: #06231b; --accent-soft: #173a31; --est: #f0b45a; --est-soft: #3a2b12;
  --danger: #ff8a93; --danger-soft: #3b1a1e; --warn: #f2c26b; --warn-soft: #362a12; --heat-l: 19%; --heat-s: 30%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; font-family: var(--font-body); margin-bottom: 4px; }
.lede { color: var(--muted); margin: 2px 0 0; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.pill.ok { color: var(--accent); border-color: var(--accent); }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 8px; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 6px; font: 500 14px var(--font-body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); min-width: 0; }
label.f .lab { display: flex; align-items: center; gap: 6px; }
input, select, textarea { width: 100%; font: 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 13px; font: 500 14px var(--font-body); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > input { flex: 1 1 260px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid2 .wide { grid-column: 1 / -1; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.editor { border: 2px solid var(--accent-soft); background: color-mix(in srgb, var(--accent-soft) 35%, var(--bg)); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.editor-cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.editor-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 12px; }
@media (max-width: 960px) { .editor-cols { grid-template-columns: minmax(0, 1fr); } .editor-side { position: static; } }
.stack { display: grid; gap: 12px; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line); }
.dot.hi { background: #1f9d6b; } .dot.mid { background: #e0a526; } .dot.lo { background: #d6404c; } .dot.ed { background: #2f7fd6; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.est { font-style: italic; color: var(--est); }
.est-tag { font: 600 10px var(--font-body); font-style: normal; color: var(--est); background: var(--est-soft); border-radius: 4px; padding: 1px 4px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 18px; }
.kpi.main { background: var(--accent-soft); }
.kpi.main .v { font-size: 22px; }
table { border-collapse: collapse; width: 100%; }
.lines td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
.lines td:last-child { text-align: right; padding-left: 8px; }
.lines tr.total td { border-bottom: 0; border-top: 2px solid var(--fg); font-weight: 600; }
.lines .note { display: block; font-size: 12px; color: var(--muted); font-style: normal; }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.alerts li { font-size: 13px; padding: 6px 9px; border-radius: 7px; border-left: 3px solid var(--line); background: var(--surface-2); }
.alerts li.danger { border-color: var(--danger); background: var(--danger-soft); }
.alerts li.warning { border-color: var(--warn); background: var(--warn-soft); }
.scroll { overflow-x: auto; }
.variants { min-width: 520px; font-size: 14px; }
.variants th { text-align: left; font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 4px 6px; }
.variants td { padding: 6px; border-top: 1px solid var(--line); }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.banner { border-radius: 8px; padding: 9px 11px; font-size: 14px; background: var(--warn-soft); color: var(--fg); }
.banner.err { background: var(--danger-soft); }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.cmp { min-width: 940px; font-size: 14px; }
.cmp th { font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px; text-align: right; white-space: nowrap; }
.cmp th:first-child { text-align: left; }
.cmp th button { background: none; border: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; }
.cmp th button.on { color: var(--fg); }
.cmp td { padding: 9px 8px; text-align: right; border-bottom: 2px solid var(--bg); }
.cmp td:first-child { text-align: left; min-width: 250px; max-width: 320px; }
.cmp tbody tr { cursor: pointer; }
.cmp tbody tr:hover td { filter: brightness(0.97); }
.cmp tr.best td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.ttl { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge { display: inline-block; font: 700 10px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); padding: 2px 6px; border-radius: 4px; margin-bottom: 3px; }
.al { font-size: 12px; text-align: left; max-width: 240px; }
.al div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.al .d { color: var(--danger); } .al .w { color: var(--warn); } .al .ok { color: var(--accent); }
.cards { display: none; list-style: none; margin: 0; padding: 0; gap: 10px; }
.card { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 11px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 6px; }
.card .top { display: flex; justify-content: space-between; gap: 10px; }
.card .top > div:first-child { min-width: 0; }
.card .big { font-size: 20px; text-align: right; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { .tablewrap { display: none; } .cards { display: grid; } .mobsort { display: flex !important; } }
.mobsort { display: none !important; }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 10px; justify-items: center; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.services .svc { display: grid; grid-template-columns: minmax(0, 1fr) 100px 100px auto auto; gap: 6px; align-items: center; background: var(--surface-2); padding: 6px; border-radius: 7px; margin-bottom: 6px; }
@media (max-width: 640px) { .services .svc { grid-template-columns: 1fr 1fr; } .services .svc input:first-child { grid-column: 1 / -1; } }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
footer { text-align: center; font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Loc<span>Compare</span></h1>
      <p class="lede">Le coût réel de chaque location, pour comparer à armes égales.</p>
    </div>
    <div class="pills" id="status"></div>
  </header>
  <section class="panel" id="add"></section>
  <div id="editor"></div>
  <section class="panel" id="settings"></section>
  <section class="panel" id="compare"></section>
  <footer>Vos annonces sont enregistrées dans votre espace privé de cet artifact (ou dans ce navigateur si vous n'êtes pas connecté). Les montants <span class="est">en italique</span> marqués <span class="est-tag">≈ estimé</span> ne viennent pas de l'annonce.</footer>
</div>
<div class="toast" id="toast" hidden></div>
